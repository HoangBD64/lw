<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Label result</title>
        <style>
                @page {
                        margin: 0;
                        padding: 5px 10px;

                }

                .page-break {
                        page-break-after: always;
                }

                body {
                        padding: 5px 10px;
                        margin: 0;
                        font-size: 32px;
                        line-height: 40px;
                }

                table {
                        width: 100%;
                        border: solid 1px #000000;
                }

                tr {
                        border: solid 1px #000000;
                }

                td {
                        border: solid 1px #000000;
                        padding: 3px 3px;
                }

                .logo {
                        position: relative;
                        padding: 50px 30px 0px 30px;
                }

                .logo img {
                        height: 150px;
                }

                .logo span {
                        position: absolute;
                        right: 30px;
                        top: 100px;
                        font-size: 64px;
                        font-weight: 900;
                }

                .code {
                        font-size: 48px;
                        text-align: center;
                        position: relative;
                        padding: 30px 0;
                }

                .code>img {
                        width: 90%;
                }

                .code strong {
                        font-weight: 900;
                        margin-top: 25px;
                        display: block;
                }

                td p {
                        font-size: 36px;
                        padding: 20px;
                }
        </style>
</head>

<body>
        {{- if .Labels }}
        {{- range $i, $row := .Labels }}
        {{- if gt $i 0 }}
        <div class="page-break"></div>
        {{- end }}
        <div style="height: 100vh; position: relative;">
                <table cellpadding="0" cellspacing="0">
                        <tr>
                                <td>
                                        <div class="logo">
                                                <img src="{{ $.Logo }}" alt="">
                                                <span>{{ $row.Country }}</span>
                                        </div>
                                </td>
                        </tr>
                        <tr>
                                <td class="code">
                                        <strong>{{ $row.Label }}</strong>
                                </td>
                        </tr>
                        <tr>
                                <td>
                                        <p><b>SHIP TO</b>: {{ $row.ShipTo }}</p>
                                        <p>Tel: {{ $row.Info }}</p>
                                </td>
                        </tr>
                </table>
                <div style="position: absolute; bottom: 20px; left: 20px;">
                        <b>Ref:</b> {{ $row.Ref }}
                </div>
        </div>
        {{- end }}
        {{- end }}
</body>

</html>

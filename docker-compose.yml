services:
  backend:
    image: registry.gitlab.com/legalswift/backend:latest
    environment:
      #DB
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Root@2024
      DB_NAME: legal_swift
      WEB_PORT: 4000
      # Token key
      SECRET_USER:  token
      SECRET_ADMIN: token1
      #SSO config 
      SSO_END_POINT: https://sso.shopasic.com
      SSO_CLIENT_ID: "4bf2bb6f630039fdc2b3"
      SSO_CLIENT_SECRET: ""
      SSO_ORGANIZATION_NAME: nvstudio
      SSO_APPLICATION_NAME: legalswift
      # s3 config
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_ENDPOINT_API: nvcdn.shopasic.com
      S3_ENDPOINT_CDN: nvcdn.shopasic.com
      S3_BUCKET: "" 
      S3_SSL: true
    volumes:
      - ./token_jwt_key.pem:/app/token_jwt_key.pem
    ports:
      - 4000:4000

